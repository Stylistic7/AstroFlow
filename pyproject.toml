[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "astroflow"
version = "0.2.5"
# Pin the Python minor (also see `.python-version`): cluster nodes must
# share one interpreter, and the pinned deps (ray, numpy, ...) only ship
# cp313 wheels — let uv pick 3.14 and `uv sync` fails with "no wheel for
# the current platform". Bump this in lockstep across all nodes.
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"

# Every node (head or worker) installs the same set so behaviour is
# identical everywhere. Splitting into head-vs-worker optional extras
# would save a few MB of disk but makes debugging environment drift
# harder; not worth it.
dependencies = [
    # Ray + core infra
    # Pin Ray: every node in the cluster must run the same version,
    # otherwise workers can't connect to the head.
    # Ray 2.48+ answers a tiny actor or task call in ~15 ms where 2.47 takes
    # 0.3 ms (measured 2026-10-19), and the graph runner makes several per node;
    # the Macs stay on 2.47. Windows needs 2.48 (2.47 crashes its agents).
    "ray==2.47.0 ; sys_platform != 'win32'",
    "ray==2.48.0 ; sys_platform == 'win32'",
    "diskcache",
    "filelock",
    "beartype",
    "structlog",
    "objsize",
    "xxhash",
    "psutil",
    "zeroconf",
    "frozendict",
    "python-dateutil",
    "pytz",
    "python-statemachine",
    "requests",
    "send2trash",
    "watchdog",              # OS change notifications for the input and shared folders (state/folder_watch.py)
    # Astronomy / image pipeline
    "astropy",
    "astroalign",
    "astroscrappy",
    "photutils",
    "cdshealpix",
    # Pin spherical-geometry: SingleSphericalPolygon objects pickle/unpickle
    # across cluster nodes; an attribute that exists in one version but
    # not another (e.g. _degenerate) crashes the receiver. Same risk as
    # the Ray wire-protocol pin above.
    "spherical-geometry==1.4.0",
    "ephem",
    "scipy",
    # Pin numpy: ndarrays pickle/unpickle across cluster nodes and into
    # the on-disk cache, so every node MUST run the same numpy — a 2.x
    # node writes a pickle module path (numpy._core) a 1.x node can't
    # load, and vice versa. Pinned to 2.x specifically because 1.26.x
    # has no Python 3.13 wheels (it predates 3.13) and would compile
    # from source on every node. Same wire-format pin rationale as ray /
    # spherical-geometry.
    "numpy==2.4.6",
    "opencv-python",
    "scikit-image",
    "Pillow",
    "pyvips",
    "tifffile",
    # Tile-pyramid pages are brotli-compressed linear float32 (see
    # previews/create_tile_pyramid.py, web_server/backend/tiles.py).
    "brotli",
    "shapely",
    "largestinteriorrectangle",
    "xisf",
    "h5py",
    # Web UI
    "flask",
    "flask-cors",
    "gunicorn",
    "gevent",
    # MCP sidecar on the head (core/mcp_server/): typed tools for an LLM
    # operator over the same read layer the web backend uses.
    "mcp>=1.9",
    "plotly",
    "matplotlib",
    "rich",
    # Tests
    "pytest",
    "pytest-benchmark",
    # Test suite runs under xdist (`pytest -n`, conftest's `worker_id`
    # fixture) with a per-test timeout (pytest.ini `timeout_method`).
    "pytest-xdist",
    "pytest-timeout",
    "ruff",
    "edt>=3.1.1",
    "waitress>=3.0.2",
    "pystray>=0.19.5 ; sys_platform == 'win32'",
    "zarr>=3.0",
]

[tool.setuptools.packages.find]
include = ["cli", "core"]

[tool.ruff]
# Match runtime Python; the `type` statement at products/registry.py:55
# is 3.12+.
target-version = "py312"
extend-exclude = [
    "GraXpert",
    "ray_infra",
    "pix",
    "p2p",
    "web_server/frontend/node_modules",
    "web_server/frontend/build",
]

[tool.ruff.lint]
# Conservative starting set: catches the bug class that just bit us
# (NameError from missing imports, scope shadows, dead references)
# without forcing a stylistic rewrite of 600 tests' worth of code.
#
#   F821  undefined-name        — the Path bug class
#   F811  redefined-while-unused — silent shadowing of an earlier
#                                  import / def with a later one
#   F402  import-shadowed-by-loop — for-loop var clobbering an import
#   E9    syntax errors          — won't import → can't run
#
# Add UP, B, SIM, etc. later when there's appetite for cleanup.
select = ["F821", "F811", "F402", "E9"]

[project.scripts]
astroflow = "cli:main"
