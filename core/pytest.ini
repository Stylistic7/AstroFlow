[pytest]
# Two-tier testing strategy:
#   Default `pytest`   — fast "core" safety net: decisions, identification,
#                        caching, graph building. A few minutes.
#   `pytest -m exhaustive`  — slow full-pipeline tests: mosaic builds,
#                             benchmarks, graph-runtime stress tests.
#                             Run before committing.
#   `pytest pix/`      — PixInsight integration tests. Run when touching pix/.
#
# pix/ is excluded at the directory level because its tests are slow and
# orthogonal to most changes.
# p2p/ is excluded because it's been broken for a while and is not on the
# critical path; re-enable when p2p work resumes.
#
# Three environments run it (.github/workflows/tests.yml):
#   unit         a cloud runner with no fixtures and no Siril: `make tests-unit`,
#                which deselects `testdata` and `siril`; every pull request.
#   integration  a cloud runner with Siril and the fixtures that
#                core/testdata/fetch.py brings: `make tests`; main and nightly.
#   studio       a Mac with PixInsight and RC Astro: `make tests` before a release.
addopts = --ignore=GraXpert --ignore=ray_infra --ignore=pix --ignore=p2p --import-mode=importlib -m "not exhaustive"
testpaths = .
# Aggressive default for FAST/core tests: any stalled > 240s is killed with
# a stack dump — a regression tripwire (e.g. the graph executor slowing down).
# 240, not 120 (2026-10-22): the graph fixtures plate-solve their 27 input
# frames from scratch since solve-field stopped trusting a header's WCS
# (`--no-verify`), ~35 s more than verifying the WCS those frames carry did,
# which put the slowest graph test at 120 s on its own and more in a shard.
# Exhaustive tests are known-slow by design (full mosaic builds, WBPP runs,
# benchmarks), so a wall-clock ceiling on them is meaningless — conftest.py's
# pytest_collection_modifyitems disables the timeout for anything marked
# `exhaustive`. Don't add @pytest.mark.timeout to exhaustive tests.
timeout = 240
timeout_method = thread
markers =
    exclusive: marks tests as exclusive (runs last within its worker)
    exhaustive: opt-in slow tests (full pipelines, benchmarks, stress tests)
    slow: opt-in slow tests requiring external tooling (PixInsight, network)
    serial: timing/benchmark tests (wall-time or parallel-speedup assertions) that are flaky under parallel load; the process-per-file runner (scripts/run_parallel_tests.py) runs these serially on the full machine, after the parallel correctness phase
    testdata: reads the real frames under core/testdata (core/testdata/fetch.py brings them); the unit tier deselects these
    siril: runs Siril; the unit tier deselects these
