# astrometry.net's solve-field for the Windows app (app/windows/build_solve_field.sh).
name: solve-field for Windows
on:
  workflow_dispatch:
  push:
    paths:
      - app/windows/build_solve_field.sh
      - .github/workflows/solve-field-windows.yml
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cygwin/cygwin-install-action@v6
        with:
          platform: x86_64
          packages: |
            gcc-core
            make
            pkg-config
            zlib-devel
            dash
            zip
            curl
      - name: Build
        shell: C:\cygwin\bin\bash.exe -eo pipefail -o igncr '{0}'
        run: bash -o igncr ./app/windows/build_solve_field.sh
      - uses: actions/upload-artifact@v4
        with:
          name: solve-field-windows-x64
          path: solve-field-windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            _build/cfitsio-*/configure.log
            _build/cfitsio-*/make.log
            _build/astrometry.net-*/make.log
